# Serves the status page and proxies the Vigia API on the same origin.
server {
    listen 80;
    root /usr/share/nginx/html;

    # Docker's DNS, re-resolved per request, so recreating the api container never leaves a stale address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8080;

    location / {
        try_files $uri /index.html;
    }

    location ~ ^/(api|status|worker)/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
